version: '3.8'

services:
  web:
    build: .
    command: gunicorn minghaishiyi.wsgi:application --bind 0.0.0.0:8000 --workers 4
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DJANGO_SETTINGS_MODULE=minghaishiyi.settings
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=minghaishiyi
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_HOST=db
      - DB_PORT=3306

  db:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=minghaishiyi
    ports:
      - "3306:3306"

volumes:
  mysql_data:
